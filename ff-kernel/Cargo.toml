[package]
name = "ff-kernel"
version = "0.1.0"
edition = "2024"
description = "ET-SoC-1 device kernel: parallel form-factor matrix computation"

[[bin]]
name = "ff-kernel"
path = "src/main.rs"

[dependencies]
et-k-rs  = "0.6"
et-abi   = "0.6"
# radiosity-abi must also be no_std; the kernel depends on it for Patch and
# FormFactorArgs without pulling in any host-side crates.
radiosity-abi = { path = "../radiosity-abi" }

[profile.release]
panic     = "abort"
opt-level = "s"   # optimise for size: reduces I-cache pressure on the ET-SoC-1
lto       = true

[profile.dev]
panic = "abort"
