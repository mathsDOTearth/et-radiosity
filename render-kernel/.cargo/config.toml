# Cross-compilation configuration for ET-SoC-1 compute harts.
#
# The ET-SoC-1 Minion cores implement RV64IMAC plus the hardware F extension
# (single-precision FP registers f0..f31). The target triple uses the soft-float
# ABI ("imac", no "f" in the triple) to remain compatible with the et-k-rs
# library, which is published against that ABI. Adding "+f" here enables the
# compiler to emit hardware FADD/FMUL/FDIV/FSQRT instructions for f32 arithmetic
# without changing the ABI: float arguments still cross call boundaries through
# integer registers, but LTO inlines the entire hot path so no ABI crossings
# remain in the render loop. The result is ~20-50x faster f32 throughput
# compared with compiler_builtins soft-float routine calls.
#
# The kernel is linked at a fixed U-mode entry address (see link.ld), so the
# medany (PC-relative) code model is required. Static relocation avoids GOT
# indirection in a position-dependent image.

[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "code-model=medium",
    "-C", "link-arg=-Tlink.ld",
    "-C", "relocation-model=static",
    # Enable hardware single-precision FP instructions. The ET-SoC-1 Minion
    # cores have the F extension; the soft-float ABI is preserved (triple
    # unchanged) so et-k-rs library calls remain ABI-compatible.
    "-C", "target-feature=+f",
    # Note: -C target-cpu=et-soc1 is intentionally absent. ET PS SIMD code
    # lives in nearest_hit_simd.s, assembled by ET GAS via build.rs; stable
    # LLVM never sees PS instructions and does not need the CPU name.
]
